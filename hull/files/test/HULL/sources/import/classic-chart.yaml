# Output of a typical classic Helm chart, rendered for release 'shop' into namespace 'demo',
# as produced by 'helm create' style templates plus the usual extras.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-web
  labels:
    helm.sh/chart: web-1.4.2
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-web-credentials
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
type: Opaque
data:
  DATABASE_PASSWORD: czNjcjN0
  api-token: dG9rZW4tMTIz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-web-config
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
data:
  LOG_LEVEL: info
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      server {
        listen 8080;
        location / { proxy_pass http://127.0.0.1:3000; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  labels:
    helm.sh/chart: web-1.4.2
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  labels:
    helm.sh/chart: web-1.4.2
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: shop
  template:
    metadata:
      annotations:
        checksum/config: 7f2c9e0d
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: shop
    spec:
      serviceAccountName: shop-web
      securityContext:
        runAsNonRoot: true
        fsGroup: 2000
      containers:
        - name: web
          image: "ghcr.io/example/shop-web:2.3.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-web-credentials
                  key: DATABASE_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: shop-web-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: shop-web-config
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: web
                    app.kubernetes.io/instance: shop
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: shop
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "shop.example.com"
      secretName: shop-web-tls
  rules:
    - host: "shop.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-web
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-web
subjects:
  - kind: ServiceAccount
    name: shop-web
    namespace: demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shop-web-cleanup
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: web-cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: shop-web
          containers:
            - name: cleanup
              image: "ghcr.io/example/shop-tools:2.3.0"
              command: ["/bin/cleanup", "--older-than=24h"]
---
apiVersion: v1
kind: Pod
metadata:
  name: shop-web-test-connection
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['shop-web:80']
